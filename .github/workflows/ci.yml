name: CI

on:
  push:
    branches: [main, architecture-redesign]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tests
        run: python3 -m unittest discover -s tests

      - name: Build site from data/site_data.json
        run: python3 renderer/build_site.py

      - name: Build parity check
        run: python3 scripts/validate/validate_staging_parity.py

      - name: Content lint (generics, structure, version badges)
        run: python3 scripts/validate/validate_syntax_html.py

      - name: Internal link check
        run: python3 scripts/validate/validate_links.py

      - name: HTML well-formed smoke check
        run: python3 scripts/validate/validate_html_smoke.py

      - name: Python version-history examples and probes
        run: python3 scripts/check/check_python_examples.py --strict

      - name: Install the Rust toolchains the checker runs on
        run: rustup toolchain install 1.75.0 1.95.0 --profile minimal --no-self-update

      - name: Rust examples and probes (oldest and newest toolchain)
        run: |
          python3 scripts/check/check_rust_examples.py --strict --rustc "rustup run 1.75.0 rustc"
          python3 scripts/check/check_rust_examples.py --strict --rustc "rustup run 1.95.0 rustc"

      - name: Install the .NET SDKs the C# checker compiles with
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Install Mono for the .NET Framework reference assemblies
        run: |
          sudo apt-get update
          sudo apt-get install -y mono-devel

      - name: C# examples, compatibility notes and probes
        run: python3 scripts/check/check_csharp_examples.py --strict

  cpp-toolchains:
    name: C++ toolchain checks
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the GCC and Clang configurations the C++ checker compiles with
        run: bash scripts/ci/setup_cpp_toolchains.sh

      - name: C++ examples, version markers and standard boundaries
        run: python3 scripts/check/check_cpp_examples.py --strict
