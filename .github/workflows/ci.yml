name: CI

on:
  push:
    branches: [main, architecture-redesign]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tests
        run: python3 -m unittest discover -s tests

      - name: Build site from data/site_data.json
        run: python3 renderer/build_site.py

      - name: Generated output is up to date
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Committed output differs from a fresh build. Run 'python renderer/build_site.py' and commit the result."
            git status --short
            git --no-pager diff --stat
            exit 1
          fi

      - name: Staging parity check
        run: python3 scripts/validate_staging_parity.py

      - name: Content lint (generics, structure, version badges)
        run: python3 scripts/validate_syntax_html.py

      - name: Internal link check
        run: python3 scripts/validate_links.py

      - name: HTML well-formed smoke check
        run: python3 scripts/validate_html_smoke.py
